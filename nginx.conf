# Cache policy by path. Hashed /assets/* are immutable; EVERYTHING else —
# above all index.html and sw.js — must revalidate on every request
# ("no-cache" = may store, must revalidate). Without this, browsers apply
# heuristic caching to index.html and can keep serving a stale shell (old
# chunk hashes) after a deploy — which also defeats the client's one-time
# chunk-error recovery reload and lands users on the error screen.
# A map + one server-level add_header (rather than per-location add_header)
# because add_header in a location suppresses inheritance of every server-level
# header, which would silently drop the security headers below.
map $uri $armada_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $armada_cache_control always;

    # Security headers. The client holds Nostr private keys in the browser, so
    # the priority is limiting XSS blast radius and key exfiltration.
    #
    # CSP notes:
    #  - connect-src is intentionally broad (wss:/https:): users add arbitrary
    #    Nostr relays at runtime, so we can't enumerate origins. blob: is for
    #    the LiveKit e2ee web worker; data: for inline media.
    #  - script-src omits 'unsafe-inline'/'unsafe-eval' to block injected
    #    inline scripts (the main key-exfil vector). Vite's production build
    #    emits external hashed scripts, so this holds. 'wasm-unsafe-eval'
    #    permits WebAssembly compilation ONLY (not JS eval) — required by the
    #    RNNoise noise-cancellation AudioWorklet; without it the worklet's
    #    WASM is blocked at runtime and the published mic track goes silent.
    #  - object-src 'none', base-uri 'self', frame-ancestors 'none' close off
    #    plugin, base-tag, and clickjacking vectors.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' wss: https: blob:; media-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(), payment=()" always;

    # Immutable hashed assets. These MUST NOT fall back to index.html: a request
    # for a chunk hash that no longer exists on the server (an old tab / stale
    # edge cache after a deploy) has to return 404, not a 200 text/html shell.
    # Serving index.html here means the browser tries to execute HTML as a JS
    # module (or a dynamic import() resolves to a bogus module), which surfaces
    # downstream as "useContext(...) is null" and trips the error boundary. A
    # clean 404 lets the SW / chunk-load-error recovery reload to a consistent
    # build instead. Declared before `location /` so it wins for /assets/*.
    # Cache-Control comes from the $armada_cache_control map above — adding it
    # here with add_header would suppress inheritance of the security headers.
    location /assets/ {
        try_files $uri =404;
    }

    # iOS Universal Links association file. It has no extension, so nginx's
    # mime.types has nothing to match and it would fall back to default_type —
    # but Apple's CDN wants application/json. `default_type` (not `add_header`)
    # so the server-level security headers are still inherited. Must be served
    # verbatim with no redirect; a 301 here silently breaks link association.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    # SPA fallback (navigations only).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
