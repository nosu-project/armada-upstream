# Armada CI/CD
#
# The web client lives in client/. This pipeline builds the web app, wraps it
# in the committed Capacitor Android project (client/android), and produces a
# signed release APK + AAB on version tags (vX.Y.Z), mirroring how ../ditto
# builds its APK.
#
# Required CI/CD variables (Settings → CI/CD → Variables), all "masked" and the
# base64 one "Protected" if tags are protected:
#   ANDROID_KEYSTORE_BASE64  base64 of the JKS upload keystore (alias: upload)
#   KEYSTORE_PASSWORD        keystore store password
#   KEY_PASSWORD             upload key password (== store password; PKCS12 needs them equal)
# These live ONLY in CI/CD variables — never commit the keystore, the passwords,
# or any generated secrets file to the repo.

stages:
  - test
  - build
  - release

default:
  interruptible: true

# ── Web client lint/typecheck/test ──────────────────────────────────────────
test:
  stage: test
  image: node:22
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  cache:
    key:
      files:
        - client/package-lock.json
    paths:
      - client/node_modules/
  script:
    - cd client
    - npm ci
    - npm run test
    # Fail the pipeline on known-high/critical advisories in dependencies.
    - npm audit --audit-level=high

# ── Relay build + vulnerability scan ────────────────────────────────────────
relay:
  stage: test
  image: golang:1.24
  timeout: 10 minutes
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: always
  cache:
    key: go-mod
    paths:
      - .gocache/
  variables:
    GOPATH: $CI_PROJECT_DIR/.gocache
  script:
    - cd server
    - go build ./...
    - go vet ./...
    - go run golang.org/x/vuln/cmd/govulncheck@latest ./...


# ── Signed Android APK + AAB on version tags ────────────────────────────────
build-apk:
  stage: build
  image: eclipse-temurin:21-jdk
  timeout: 25 minutes
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    ANDROID_SDK_ROOT: /opt/android-sdk
    ANDROID_HOME: /opt/android-sdk
  before_script:
    # System dependencies
    - apt-get update -qq
    - apt-get install -y -qq curl unzip > /dev/null

    # Node.js 22
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y -qq nodejs > /dev/null
    - node --version
    - npm --version

    # Android SDK command-line tools
    - mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
    - curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
    - unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
    - mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
    - export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

    # Accept licenses and install SDK components (must match android/variables.gradle)
    - printf 'y\ny\ny\ny\ny\ny\ny\n' | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

    # Point Gradle at the SDK
    - echo "sdk.dir=$ANDROID_SDK_ROOT" > client/android/local.properties

    # Decode signing keystore and migrate JKS -> PKCS12 for Gradle compatibility.
    # PKCS12 uses a single password, so the key and store passwords must match
    # (KEY_PASSWORD == KEYSTORE_PASSWORD by construction — see secrets README).
    - echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > client/android/app/my-upload-key.jks
    - keytool -importkeystore
        -srckeystore client/android/app/my-upload-key.jks
        -destkeystore client/android/app/my-upload-key.keystore
        -deststoretype pkcs12
        -srcstorepass "$KEYSTORE_PASSWORD"
        -deststorepass "$KEYSTORE_PASSWORD"
        -srcalias upload
        -destalias upload
        -noprompt
    - rm client/android/app/my-upload-key.jks

    # Write key.properties consumed by android/app/build.gradle
    - |
      cat > client/android/key.properties << EOF
      storePassword=$KEYSTORE_PASSWORD
      keyPassword=$KEY_PASSWORD
      keyAlias=upload
      storeFile=my-upload-key.keystore
      EOF
  script:
    # Semver from the tag (v2.1.0 -> 2.1.0); versionCode from the pipeline IID.
    - TAG="${CI_COMMIT_TAG#v}"
    - VERSION_NAME="${TAG}"
    - VERSION_CODE="${CI_PIPELINE_IID}"
    - echo "Building version $VERSION_NAME (code $VERSION_CODE) from tag $CI_COMMIT_TAG"

    # Stamp version into android/app/build.gradle
    - sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" client/android/app/build.gradle
    - sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" client/android/app/build.gradle

    # Build web assets and sync into the Capacitor Android project
    - cd client
    - npm ci
    - npx vite build -l error
    - cp dist/index.html dist/404.html
    - npx cap sync android
    - cd ..

    # Build signed release APK + AAB
    - cd client/android && chmod +x gradlew && ./gradlew assembleRelease bundleRelease && cd ../..

    # Collect artifacts under a predictable path
    - mkdir -p artifacts
    - cp client/android/app/build/outputs/apk/release/app-release.apk "artifacts/Armada.apk"
    - cp client/android/app/build/outputs/bundle/release/app-release.aab "artifacts/Armada.aab"
    - ls -lh artifacts/

    # Upload to the Generic Packages registry for a stable public download URL
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "artifacts/Armada.apk" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}.apk"
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "artifacts/Armada.aab" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}.aab"
  artifacts:
    paths:
      - artifacts/Armada.apk
      - artifacts/Armada.aab
    expire_in: 90 days
  cache:
    key: android-gradle
    paths:
      - client/android/.gradle/
      - client/.gradle/

# ── Desktop (Electron) builds on version tags ───────────────────────────────
#
# Armada desktop is a SOVEREIGN, standalone client: it bundles the web build and
# serves it over a custom secure scheme (see client/electron/main.js). The web
# build is compiled with EMPTY platform relays (VITE_PLATFORM_RELAYS="") so
# nothing is baked in — the user adds whatever servers they want.
#
# build-desktop-web builds that web bundle ONCE; the per-platform jobs consume it
# as an artifact and run electron-builder. The app icon is committed at
# client/electron/build/icon.png (electron-builder derives .ico/.icns from it).

# Build the standalone web bundle (no pinned relays) and hand it to the
# platform jobs at client/electron/dist/.
build-desktop-web:
  stage: build
  image: node:22
  timeout: 15 minutes
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  variables:
    # No baked-in relays: a rogue client starts empty and the user adds servers.
    VITE_PLATFORM_RELAYS: ""
    # App relays still seed non-NIP-29 traffic (profiles/lists); user-editable.
    VITE_APP_RELAYS: ${VITE_APP_RELAYS}
  cache:
    key:
      files:
        - client/package-lock.json
    paths:
      - client/node_modules/
  script:
    - cd client
    - npm ci
    - npx vite build -l error
    - cp dist/index.html dist/404.html
    # Stage the web bundle inside the electron app dir for packaging.
    - rm -rf electron/dist
    - cp -r dist electron/dist
  artifacts:
    paths:
      - client/electron/dist/
    expire_in: 1 day

.desktop-template: &desktop-template
  stage: build
  timeout: 30 minutes
  needs:
    - job: build-desktop-web
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    # Version from the tag (v2.1.0 -> 2.1.0).
    - export TAG="${CI_COMMIT_TAG#v}"
    - cd client/electron
    # Stamp the version into the Electron app's package.json.
    - 'sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${TAG}\"/" package.json'
    - npm install --no-audit --no-fund
  cache:
    key: electron-builder-cache
    paths:
      - client/electron/.cache/

build-desktop-linux:
  <<: *desktop-template
  image: electronuserland/builder:20
  script:
    - npx electron-builder --linux --config electron-builder.yml --publish never
    - cd ../..
    - mkdir -p artifacts
    # Collect the AppImage + deb under predictable names.
    - cp client/electron/release/*.AppImage "artifacts/Armada-${CI_COMMIT_TAG}-linux-x86_64.AppImage"
    - cp client/electron/release/*.deb "artifacts/Armada-${CI_COMMIT_TAG}-linux-amd64.deb"
    - ls -lh artifacts/
    - |
      for f in artifacts/*; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/$(basename "$f")"
      done
  artifacts:
    paths:
      - artifacts/Armada-*-linux-*
    expire_in: 90 days

build-desktop-windows:
  <<: *desktop-template
  # The -wine variant bundles wine so electron-builder can produce Windows
  # installers from a Linux runner. Pin an explicit Node tag (matching the
  # Linux job): the bare ":wine"/":20" tags are no longer reliably published.
  image: electronuserland/builder:20-wine
  script:
    - npx electron-builder --win --config electron-builder.yml --publish never
    - cd ../..
    - mkdir -p artifacts
    - cp client/electron/release/*Setup*.exe "artifacts/Armada-${CI_COMMIT_TAG}-Setup.exe"
    # The portable build is the non-Setup .exe.
    - cp $(ls client/electron/release/*.exe | grep -iv setup | head -n1) "artifacts/Armada-${CI_COMMIT_TAG}-windows-portable.exe"
    - ls -lh artifacts/
    - |
      for f in artifacts/Armada-${CI_COMMIT_TAG}-Setup.exe artifacts/Armada-${CI_COMMIT_TAG}-windows-portable.exe; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/$(basename "$f")"
      done
  artifacts:
    paths:
      - artifacts/Armada-*-Setup.exe
      - artifacts/Armada-*-windows-portable.exe
    expire_in: 90 days

# macOS .dmg. Requires a runner tagged `macos` (Apple hardware — GitLab.com's
# shared runners are Linux only). Manual + allow_failure so a pipeline without
# such a runner still succeeds. For a Gatekeeper-friendly (non-quarantined)
# build, add Apple signing/notarization secrets (CSC_LINK, CSC_KEY_PASSWORD,
# APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID); otherwise the .dmg is
# unsigned and users must right-click → Open the first time.
build-desktop-macos:
  <<: *desktop-template
  tags:
    - macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
      allow_failure: true
  before_script:
    - export TAG="${CI_COMMIT_TAG#v}"
    - cd client/electron
    - 'sed -i "" "s/\"version\": \"[^\"]*\"/\"version\": \"${TAG}\"/" package.json || sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${TAG}\"/" package.json'
    - npm install --no-audit --no-fund
  script:
    - npx electron-builder --mac --config electron-builder.yml --publish never
    - cd ../..
    - mkdir -p artifacts
    - for f in client/electron/release/*.dmg; do cp "$f" "artifacts/$(basename "$f")"; done
    - ls -lh artifacts/
    - |
      for f in artifacts/*.dmg; do
        curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/$(basename "$f")"
      done
  artifacts:
    paths:
      - artifacts/*.dmg
    expire_in: 90 days

# ── GitLab Release attaching the APK/AAB package links ──────────────────────
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-apk
      artifacts: false
    - job: build-desktop-linux
      artifacts: false
    - job: build-desktop-windows
      artifacts: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: "Armada $CI_COMMIT_TAG"
    assets:
      links:
        - name: Armada-${CI_COMMIT_TAG}.apk
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}.apk
          link_type: package
        - name: Armada-${CI_COMMIT_TAG}.aab
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}.aab
          link_type: package
        - name: Armada-${CI_COMMIT_TAG}-linux-x86_64.AppImage
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}-linux-x86_64.AppImage
          link_type: package
        - name: Armada-${CI_COMMIT_TAG}-linux-amd64.deb
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}-linux-amd64.deb
          link_type: package
        - name: Armada-${CI_COMMIT_TAG}-Setup.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}-Setup.exe
          link_type: package
        - name: Armada-${CI_COMMIT_TAG}-windows-portable.exe
          url: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/armada/${CI_COMMIT_TAG}/Armada-${CI_COMMIT_TAG}-windows-portable.exe
          link_type: package
