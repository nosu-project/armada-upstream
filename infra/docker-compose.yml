# Armada internal stack: NIP-29 relay + LiveKit SFU + web client.
#
# 1. cp .env.example .env  (and fill in keys; see README)
# 2. docker compose up -d --build
#
# Everything binds to the host only; put your internal reverse proxy / TLS in
# front if you serve beyond localhost.

services:
  relay:
    build: ../server
    restart: unless-stopped
    environment:
      PORT: "5577"
      DOMAIN: ${RELAY_DOMAIN:-localhost:5577}
      PUBLIC_BASE_URL: ${RELAY_PUBLIC_BASE_URL:-http://localhost:5577}
      RELAY_NAME: ${RELAY_NAME:-Armada Relay}
      RELAY_DESCRIPTION: ${RELAY_DESCRIPTION:-Internal NIP-29 group relay}
      RELAY_PRIVKEY: ${RELAY_PRIVKEY:?set RELAY_PRIVKEY in .env (64-char hex)}
      RELAY_CONTACT: ${RELAY_CONTACT:-}
      GROUP_ID: ${GROUP_ID:-armada}
      GROUP_NAME: ${GROUP_NAME:-Armada}
      ADMIN_PUBKEY: ${ADMIN_PUBKEY:?set ADMIN_PUBKEY in .env (npub or hex, comma-separated)}
      DATABASE_PATH: /data/db
      LIVEKIT_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-armada}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env (32+ chars)}
      # Web Push VAPID keys (optional). Leave empty to auto-generate + persist
      # on first run; pin them to keep the public key stable across DB wipes.
      PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
      PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
    ports:
      - "5577:5577"
    volumes:
      - relay-data:/data

  livekit:
    # Pin an exact patch: the server's signaling protocol must match the
    # bundled livekit-client SDK (client/package.json). A skew (e.g. server
    # protocol 15 vs client protocol 17) makes clients fail WebRTC negotiation
    # and full-reconnect every ~16s. Bump this together with the client SDK.
    image: livekit/livekit-server:v1.9.12
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 50000
          port_range_start: 50000
          port_range_end: 50100
          # By default LiveKit auto-discovers the public IP via STUN
          # (use_external_ip). For deployments behind a reverse proxy / split
          # network, set LIVEKIT_NODE_IP to the address clients should send
          # media to (e.g. the SFU host's LAN IP) and it takes precedence.
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: ${LIVEKIT_NODE_IP:-}
          interfaces:
            includes:
              - ${LIVEKIT_IFACE:-eth0}
        # Embedded TURN/TLS relay. Off by default (localhost quickstart needs no
        # TURN). Enable for production so clients on networks that block/mangle
        # UDP (mobile, CGNAT, corporate firewalls) relay media over TLS/443.
        # Requires a real cert for LIVEKIT_TURN_DOMAIN mounted at LIVEKIT_CERT_DIR
        # and the edge to deliver turn.<domain>:443 to this container (SNI
        # passthrough). See AGENTS.md ("Voice / LiveKit") for the full setup.
        turn:
          enabled: ${LIVEKIT_TURN_ENABLED:-false}
          domain: ${LIVEKIT_TURN_DOMAIN:-turn.localhost}
          tls_port: 443
          cert_file: /certs/tls.crt
          key_file: /certs/tls.key
          external_tls: false
        # Active-speaker detection cadence. Server defaults (400ms updates,
        # smoothed over 2 intervals) make the speaking indicator lag ~1s behind
        # actual speech; 150ms/2 keeps it responsive without flicker. Keep in
        # sync with docker-compose.prod.yml (its LIVEKIT_CONFIG replaces this
        # one entirely).
        audio:
          update_interval: 150
          smooth_intervals: 2
        keys:
          ${LIVEKIT_API_KEY:-armada}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        webhook:
          api_key: ${LIVEKIT_API_KEY:-armada}
          urls:
            - http://relay:5577/livekit/webhook
    volumes:
      - ${LIVEKIT_CERT_DIR:-./certs/turn}:/certs:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "${LIVEKIT_TURN_PORT:-5349}:443"
      - "50000-50100:50000-50100/udp"

  client:
    build:
      context: ../client
      args:
        VITE_APP_NAME: ${APP_NAME:-Armada}
        VITE_PLATFORM_RELAYS: ${PLATFORM_RELAYS:-ws://localhost:5577}
        VITE_APP_RELAYS: ${APP_RELAYS:-wss://relay.ditto.pub,wss://relay.dreamith.to}
        VITE_SEARCH_RELAYS: ${SEARCH_RELAYS:-wss://relay.ditto.pub,wss://relay.dreamith.to}
        VITE_DEFAULT_NOISE_SUPPRESSION: ${DEFAULT_NOISE_SUPPRESSION:-true}
        VITE_DEFAULT_ECHO_CANCELLATION: ${DEFAULT_ECHO_CANCELLATION:-true}
        VITE_DEFAULT_AUTO_GAIN_CONTROL: ${DEFAULT_AUTO_GAIN_CONTROL:-true}
        VITE_SANDBOX_DOMAIN: ${SANDBOX_DOMAIN:-iframe.diy}
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - relay

volumes:
  relay-data:
