<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="41.60 41.60 172.80 172.80">
  <!--
    Source art for the desktop tray icon (electron/build/tray*.png|ico).

    Same shape as the Android notification small icon
    (android/icon-src/ic_stat_armada.svg): the simplified Armada A — the
    advancing-A wedge with the ship's waterline notched into its legs, no crest
    frame and no wake. A tray slot is ~16-22px, the same budget as a status-bar
    icon, so the full crest (electron/build/icon.png) muds there.

    Sizing: the art (136x144 in the 256 crest space) is centered on the 24px
    canvas at 20px tall, leaving ~2px of transparency on every side, so the art
    doesn't collide with the panel's icon padding.

    Color: white, like every other monochrome icon in a panel. Only macOS masks
    a tray icon for you (trayTemplate.png below); a Linux panel is handed a
    BITMAP — Electron's Tray takes a NativeImage, not a themed icon name, so
    nothing in GTK/KDE ever recolors it — and Windows draws it as authored too.
    So the dark-glyph variants below exist for the panels that are light, and
    main.js picks between them.

    Regenerate with:
      cd electron
      inkscape icon-src/tray.svg -w 32 -h 32 -o build/tray-white.png
      inkscape icon-src/tray.svg -w 64 -h 64 -o build/tray-white@2x.png
      # Windows tray: real 16/24/32/48 frames beat one downscaled bitmap.
      for s in 16 24 32 48; do
        inkscape icon-src/tray.svg -w $s -h $s -o /tmp/tray-$s.png
      done
      convert /tmp/tray-*.png build/tray-white.ico
      # Dark glyph = the same alpha, RGB forced to black.
      convert /tmp/tray-*.png -fill black -colorize 100 build/tray-dark.ico
      # macOS menu-bar template: the system inverts it for dark mode and for the
      # clicked state, so only the alpha matters and the RGB is thrown away.
      convert build/tray-white.png -fill black -colorize 100 \
        -define png:color-type=6 build/trayTemplate.png
      convert build/tray-white@2x.png -fill black -colorize 100 \
        -define png:color-type=6 build/trayTemplate@2x.png
  -->
  <path fill="#ffffff"
        d="M 128,56 60,200 h 28.000488 l 9.091187,-19.99878 -3.092651,-2.00134
           -1.999512,-20.00061 H 107.09119 L 128,112 l 20.90881,45.99975 h 15.09156
           l -1.99952,20.00061 -3.09265,2.00134 9.09119,19.99878 h 28.00049 z"/>
</svg>
