# electron-builder config for the Armada desktop app.
#
# The app SOURCE is this directory (electron/): main.js + preload.js + the
# bundled web build (dist/, copied in by CI). The shell serves dist/ over a
# custom secure scheme (see main.js), so the app is fully standalone — not tied
# to any hosted domain.
#
# Built in CI on version tags; see ../.ngit/act/workflows/desktop.yml.

appId: buzz.armada.app
productName: Armada
executableName: armada
copyright: Armada

directories:
  # Installers are written here. (The bundled web build lives in ./dist, so the
  # builder output must NOT be ./dist.)
  output: release
  buildResources: build

# What ships inside the app: the shell's own files plus the bundled web build.
# electron + node_modules are provided by the builder runtime and not listed.
#
# build/ is buildResources (the installer/app icon the builder reads), but main
# .js ALSO loads icons from it at runtime — the window icon and the tray art —
# so it has to be listed here too. Unlisted, those paths don't exist inside the
# asar and the shell silently falls back: the default Electron window icon, and
# an EMPTY tray image (a blank slot in the panel).
files:
  - main.js
  - appOrigin.js
  - linuxAudioSources.js
  - preload.js
  # The ArmadaDB store, built from src/lib/db by vite.config.electron.ts. main.js
  # requires it at startup; unlisted, the require fails inside the asar and the
  # app silently falls back to IndexedDB with the user's data in the wrong place.
  - db.cjs
  - package.json
  - dist/**/*
  - build/**/*
  - "!**/*.map"
asarUnpack:
  - node_modules/@vencord/venmic/prebuilds/**/*

# The release workflow uploads these installers plus electron-builder's
# latest*.yml metadata to this static directory. electron-updater reads it on
# Windows NSIS, signed macOS builds, and Linux AppImage only; package-managed
# deb/Flatpak installs disable the in-app updater in main.js.
publish:
  provider: generic
  url: https://armada.buzz/desktop

# ── Linux ─────────────────────────────────────────────────────────────────────
linux:
  category: Network
  maintainer: Armada <chad@chadwick.site>
  syncDesktopName: true
  target:
    - AppImage
    - deb
  desktop:
    entry:
      Name: Armada
      Comment: Sovereign NIP-29 chat, channels, and voice
      Categories: Network;Chat;InstantMessaging;

# ── Windows ────────────────────────────────────────────────────────────────────
win:
  files:
    - "!node_modules/@vencord/venmic{,/**/*}"
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-Setup.${ext}

# ── macOS ─────────────────────────────────────────────────────────────────────
# Builds an UNSIGNED .dmg unless Apple Developer ID certs are provided via the
# usual electron-builder env vars (CSC_LINK / CSC_KEY_PASSWORD) plus notarization
# (APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID). Unsigned builds run
# only after a Gatekeeper override on the user's machine.
mac:
  category: public.app-category.social-networking
  files:
    - "!node_modules/@vencord/venmic{,/**/*}"
  target:
    - target: dmg
      arch: [x64, arm64]
    # electron-updater's macOS feed installs the signed zip; the dmg remains
    # the human-facing first-install artifact.
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # macOS TCC requires these usage strings in Info.plist; without them the
  # process is killed the first time getUserMedia touches the mic/camera.
  extendInfo:
    NSMicrophoneUsageDescription: Armada uses the microphone for voice calls.
    NSCameraUsageDescription: Armada uses the camera for video calls.

# Stable, predictable artifact names for the CI upload step.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
