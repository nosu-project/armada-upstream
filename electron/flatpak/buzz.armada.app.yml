app-id: buzz.armada.app

runtime: org.freedesktop.Platform
runtime-version: &runtime-version '25.08'
sdk: org.freedesktop.Sdk

base: org.electronjs.Electron2.BaseApp
base-version: *runtime-version

command: armada
separate-locales: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  - --filesystem=xdg-run/pipewire-0
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=com.canonical.AppMenu.Registrar
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: armada
    buildsystem: simple
    # The module is a repackaged Electron AppImage of prebuilt binaries, so a
    # .Debug extension carries nothing useful. Skipping it also drops the hard
    # dependency on elfutils' eu-strip/eu-elfcompress, which the build host is
    # not required to have.
    build-options:
      strip: false
      no-debuginfo: true
    build-commands:
      - chmod +x Armada.AppImage
      - ./Armada.AppImage --appimage-extract
      # venmic 7.x's published addon requires GLIBCXX_3.4.35, newer than the
      # 25.08 runtime (3.4.34). Its 6.1 addon exposes the capture API Armada
      # uses and was built against GLIBCXX_3.4.32, so replace only the native
      # prebuild; AppImage/deb continue using the package-lock-pinned 7.x addon.
      - cp -a venmic-compat/prebuilds/. squashfs-root/resources/app.asar.unpacked/node_modules/@vencord/venmic/prebuilds/
      - mv squashfs-root /app/armada
      - install -Dm755 armada-wrapper /app/bin/armada
      - install -Dm644 buzz.armada.app.desktop /app/share/applications/buzz.armada.app.desktop
      - install -Dm644 buzz.armada.app.metainfo.xml /app/share/metainfo/buzz.armada.app.metainfo.xml
      - install -Dm644 armada.png /app/share/icons/hicolor/512x512/apps/buzz.armada.app.png
    sources:
      - type: file
        path: ../release/Armada.AppImage
      - type: archive
        url: https://registry.npmjs.org/@vencord/venmic/-/venmic-6.1.0.tgz
        sha256: 7d8694997ff2eeffe1dea6205df1af56df8f2d2656d9ba966bc884b23cb08c1f
        strip-components: 1
        dest: venmic-compat
      - type: file
        path: armada-wrapper
      - type: file
        path: buzz.armada.app.desktop
      - type: file
        path: buzz.armada.app.metainfo.xml
      - type: file
        path: ../build/linux-icon.png
        dest-filename: armada.png
