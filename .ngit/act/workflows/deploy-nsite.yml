name: Deploy nsite

# Builds the web client and publishes it as the named nsite "armada" (NIP-5A
# kind 35128) described by .nsite/config.json: the files become Blossom blobs,
# the manifest mapping path -> sha256 goes to relays, and a gateway
# (nsite.lol, nosto.re, …) glues the two together. Same tool and the same
# NSYTE_BUNKER secret name as soapbox-pub/yourspace.
#
# ONE trigger: a push to main republishes the named site manifest, which IS
# the live site. A release tag is pushed with main at the same commit, so the
# tagged bundle reaches the nsite through that run; the tag itself does not
# need its own.
#
# ── Why a tag no longer publishes a snapshot ────────────────────────────────
# It used to also publish an immutable manifest snapshot (kind 5128) titled
# with the tag, so a release stayed addressable at v<snapshotIdB36>.<gateway>
# after the named site moved on. That is worth having, and this file will get
# it back — but not the way it was doing it.
#
# `nsyte snapshot` builds its event ENTIRELY from the manifest it fetches off
# the relays (`createSnapshotTemplate(sourceManifest, …)`) and has no title of
# its own, so the only way to title a snapshot with a version was to retitle
# the LIVE site to "vX.Y.Z", deploy, snapshot, retitle back and deploy again.
# Two costs, and the second is the one that ended it: a live manifest left
# titled with a version is the one piece of state this job could strand, in an
# event that by design is never replaced; and running on a tag meant the same
# commit planned this workflow TWICE (once for refs/heads/main, once for
# refs/tags/vX.Y.Z). act derives a job's container name from the workflow and
# job names alone — no run id, ref or commit — so the two runs collided on one
# container and each destroyed the other's ("No such container: …").
#
# Revisit when nsyte can title a snapshot directly (a `--title` on `snapshot`,
# or a snapshot taken from a directory rather than from the live manifest).
# Then a tag can publish a snapshot and NOTHING else, in its own workflow file
# so the container names differ. Snapshots already published stay published —
# nothing here retracts them.
#
# ── Secrets (provisioned by the ngit-ci operator for this repo's alias) ──────
# ngit-ci injects ${{ secrets.* }} ONLY on maintainer-authored triggers — a
# push to a watched repo always qualifies — and ONLY for secrets the operator
# has provisioned for this repo (there is no GITHUB_TOKEN, nothing is injected
# by default). Ask the operator to set, keyed to this repo's #ALIAS:
#   NSYTE_BUNKER              nbunksec1... — a pre-established NIP-46 session,
#                             the form nsyte documents for CI (`nsyte ci`).
#                             The SIGNING PUBKEY IS THE SITE ADDRESS, so this
#                             secret decides whose namespace the site lives in.
#   KLIPY_API_KEY             KLIPY production API key used by GIF search
#   VITE_NOSTR_PUSH_PUBKEY    public hex/npub identity of the NIP-PUSH gateway
#   VITE_NOSTR_PUSH_RELAYS    comma-separated rendezvous relays for its RPC
#   VITE_BRIDGE_PORTAL_URL    (optional) Discord bridge portal origin
# An empty NSYTE_BUNKER FAILS the job rather than skipping quietly: this is
# the only workflow that publishes the client anywhere, so a skipped run
# leaves the nsite silently pinned to an older build.

# `nsyte validate` checks .nsite/config.json against nsyte's own schema, which
# is narrower than NIP-5A in at least one place that matters here: `source`
# must match ^https?://, so the repo is named by its gitworkshop.dev URL and
# NOT by the nostr:// remote the NIP permits. Run it after editing the config —
# an invalid file fails the deploy after the build, not before.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Vite inlines VITE_* at build time.
      VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
      VITE_NOSTR_PUSH_PUBKEY: ${{ secrets.VITE_NOSTR_PUSH_PUBKEY }}
      VITE_NOSTR_PUSH_RELAYS: ${{ secrets.VITE_NOSTR_PUSH_RELAYS }}
      VITE_BRIDGE_PORTAL_URL: ${{ secrets.VITE_BRIDGE_PORTAL_URL }}
      # Deliberately NO VITE_PLAUSIBLE_*: that secret names armada.buzz as the
      # site, and this build is served from a gateway subdomain, so it would
      # file its traffic under a domain it isn't. Empty = tracker never
      # initialized, i.e. no telemetry.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ahead of npm ci and the build, so a config nsyte won't accept costs
      # seconds instead of failing at the end of a green-looking run.
      - name: Install nsyte and validate the config
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu
          # No apostrophe in that message: bash treats a single quote inside
          # ${var:?word} as opening a quoted section, even within the double
          # quotes, and swallows the rest of the script.
          : "${NSYTE_BUNKER:?NSYTE_BUNKER is not set; ask the ngit-ci operator to provision it for the #ALIAS of this repo.}"

          # Pin the binary as a FLOOR, not an exact version. An unversioned
          # install has been observed pulling 0.10.1, which emits legacy
          # kind-34128 events that every current gateway ignores while still
          # reporting a successful deploy. 0.28.0 is the floor because it is the
          # first release whose nostr-tools will encrypt a NIP-44 payload larger
          # than 64 KiB; under it, signing a large site manifest through the
          # bunker fails outright.
          #
          # nsyte is baked into the coordinator's CI image alongside zsp
          # (armada's .ngit/ci-image/Dockerfile). Comparing its VERSION rather
          # than just `command -v` is deliberate: a stale baked binary silently
          # outranked this pin, which is how deploys kept running 0.27.2 long
          # after the pin moved. Accepting anything NEWER than the floor lets
          # the image move ahead of these files without sending every job back
          # to the download.
          #
          # That download is the fallback for a coordinator whose image lacks
          # nsyte, and is exactly what kept failing here: the ~129 MB release
          # asset broke mid-transfer with "SSL_read: decryption failed or bad
          # record mac", identically on every attempt within a run, taking
          # deploy-nsite down across every repo. Hence the loop, HTTP/1.1, and
          # running the binary before trusting it.
          NSYTE_MIN_VERSION=0.28.0
          # nsyte colours its version output with ANSI escapes even when piped.
          baked="$(NO_COLOR=1 nsyte --version 2>/dev/null \
                   | sed 's/\x1b\[[0-9;]*m//g' | awk 'NR == 1 { print $2 }')"
          oldest="$(printf '%s\n%s\n' "$NSYTE_MIN_VERSION" "$baked" | sort -V | head -1)"
          if [ -n "$baked" ] && [ "$oldest" = "$NSYTE_MIN_VERSION" ]; then
            echo "using the nsyte baked into the runner image ($baked)"
          else
            test -z "$baked" || echo "baked nsyte $baked is below $NSYTE_MIN_VERSION; downloading"
            NSYTE_URL="https://github.com/sandwichfarm/nsyte/releases/download/v${NSYTE_MIN_VERSION}/nsyte-linux-${NSYTE_MIN_VERSION}"
            ok=""
            for attempt in 1 2 3 4 5; do
              if curl -fsSL --http1.1 --retry 2 --retry-delay 5 --retry-all-errors \
                   --connect-timeout 20 --max-time 900 -o /usr/local/bin/nsyte "$NSYTE_URL" \
                 && chmod +x /usr/local/bin/nsyte \
                 && nsyte --version >/dev/null; then
                ok=yes
                break
              fi
              echo "nsyte download attempt $attempt failed; retrying in 10s"
              sleep 10
            done
            test -n "$ok" || { echo "could not download a working nsyte after 5 attempts"; exit 1; }
          fi
          nsyte --version

          nsyte validate

      - run: npm ci

      # Build the SPA. `npm run build` compiles the Mini App realtime transport
      # (crates/webxdc-rt, iroh-gossip -> wasm) through a prebuild hook that is
      # deliberately non-fatal for frontend-only contributors — so here, where
      # it is NOT optional, WEBXDC_RT_REQUIRED makes a missing toolchain or a
      # failed compile fail the deploy instead of quietly publishing a build
      # with multiplayer switched off. The Rust toolchain and the warm iroh
      # dependency tree are baked into the armada-ci runner image
      # (.ngit/ci-image/Dockerfile). (npm build also copies dist/index.html ->
      # dist/404.html, the path NIP-5A host servers fall back to.)
      - run: npm run build
        env:
          WEBXDC_RT_REQUIRED: "1"

      # This deploy IS the Flatpak signing key's out-of-band channel: the
      # manifest published below is signed by the nsite key and commits every
      # path to a sha256, so the fingerprint it attests is vouched for by a
      # Nostr key rather than by armada.buzz's TLS. The README tells users to
      # check the key against it, so a build that quietly dropped the file
      # would leave those instructions pointing at a 404 while this job stayed
      # green — and the released repository would then be signed by a key no
      # independent channel names. Refuse to deploy instead.
      - name: Verify the published Flatpak key fingerprint
        run: |
          set -eu
          committed=public/.well-known/armada-flatpak.fingerprint
          published=dist/.well-known/armada-flatpak.fingerprint
          for file in "$committed" "$published"; do
            if [ ! -s "$file" ]; then
              echo "Flatpak signing fingerprint is missing from $file; refusing to deploy." >&2
              exit 1
            fi
          done
          # Byte-identical, not merely equal after normalization: the manifest
          # commits to the bytes served, and this is what users will `cat`.
          cmp "$committed" "$published"
          value=$(cat "$published")
          case "$value" in
            *[!0-9A-F]*|"")
              echo "Published Flatpak fingerprint is not an uppercase hexadecimal fingerprint." >&2
              exit 1
              ;;
          esac
          if [ "${#value}" -ne 40 ]; then
            echo "Published Flatpak fingerprint must be a full 40-character primary fingerprint." >&2
            exit 1
          fi
          echo "Announcing Flatpak signing key $value."

      - name: Publish to Blossom + relays
        # act does NOT enforce a job's `timeout-minutes` (it parses the field
        # and only debug-logs it); the step-level one below is the only
        # deadline this workflow actually has. Without it a wedged nsyte waits
        # for the coordinator's run-level timeout, which replaces every job
        # result act has already produced with a single synthetic one — so the
        # logs that would explain the hang are the first thing lost.
        # `nsyte deploy` has no internal deadline of its own.
        timeout-minutes: 15
        env:
          NSYTE_BUNKER: ${{ secrets.NSYTE_BUNKER }}
        run: |
          set -eu

          # Relays/servers/site id/title all come from .nsite/config.json, so
          # they are versioned with the client rather than split across this
          # file — and this job never writes to it, so there is no site state
          # a failed run can leave behind.
          #
          # The secrets scan is skipped because it prompts on false positives
          # in our own bundle (pubkeys, bunker:// parsing code), and a prompt
          # is unanswerable here — with -i it defaults to N and aborts.
          #
          # The session goes on the command line because that is the only
          # non-interactive way in: nsyte's `--prompt-sec` is a Cliffy
          # `Secret.prompt`, a hidden TTY input that cannot be piped. So the
          # nbunksec is visible in the runner's process list, to host root —
          # which already holds it, since the coordinator passes it in from
          # its own environment. Job containers get no docker socket and their
          # own PID namespace, so a concurrent job cannot read it.
          set +e
          nsyte deploy dist \
            --sec "$NSYTE_BUNKER" \
            --concurrency 2 \
            --non-interactive \
            --skip-secrets-scan 2>&1 | tee /tmp/nsyte-deploy.log
          status="${PIPESTATUS[0]}"
          set -e
          # A deploy that changes no file exits NON-ZERO with "No new files
          # to upload". That is success: the manifest already on the relays
          # describes exactly this build.
          if [ "$status" -ne 0 ] && ! grep -q "No new files to upload" /tmp/nsyte-deploy.log; then
            exit "$status"
          fi
