name: Android release

# Signed Android APK + AAB on version tags (vX.Y.Z), published as run
# artifacts, to Zapstore, and to Google Play — all in ONE job. Ported from the
# GitLab `build-apk` + `publish-zapstore` jobs (+ ditto's `publish-google-play`)
# to ngit-ci (act / GitHub Actions syntax). We keep build+publish in a single
# job on purpose: act's local artifact server round-trips a multi-file wildcard
# upload back as a 3-byte stub, so handing the APK across jobs via
# upload/download-artifact fed zsp an empty file. Results and artifacts surface
# on gitworkshop.dev against the tagged commit.
#
# ── Runner image ─────────────────────────────────────────────────────────────
# Jobs run in the coordinator's armada-ci image (NGIT_CI_ACT_PLATFORMS maps
# ubuntu-latest to it), which pre-bakes the JDK/node/go toolcaches, the
# Android SDK, ruby+fastlane, the zsp binary, and warm ~/.gradle + ~/.npm
# dependency caches — see .ngit/ci-image/Dockerfile. Without it every run
# re-downloaded ~700 MB of toolchain+deps and blew the coordinator's 30-min
# default job timeout (NGIT_CI_JOB_TIMEOUT_SECS).
#
# ── Version ──────────────────────────────────────────────────────────────────
# The version is carried by the git tag (vX.Y.Z), never a committed field:
#   VERSION_NAME = tag minus leading "v"   (v2.1.0 -> 2.1.0)
#   VERSION_CODE = major*1_000_000 + minor*1_000 + patch, derived from the tag
#                  (was $CI_PIPELINE_IID on GitLab, then git rev-list --count on
#                  ngit-ci — but ngit-ci shallow-fetches only the tagged commit,
#                  so the count was always 1 and every release got the same code)
#
# ── Secrets (provisioned by the ngit-ci operator for this repo's alias) ──────
# Injected ONLY on maintainer-authored triggers (a tag push by a maintainer
# qualifies). Ask the operator to set, keyed to this repo's #ALIAS:
#   ANDROID_KEYSTORE_BASE64  base64 of the JKS upload keystore (alias: upload)
#   KEYSTORE_PASSWORD        keystore store password
#   KEY_PASSWORD             upload key password (== store password; PKCS12
#                            uses a single password, so the two must match)
#   ZAPSTORE_BUNKER_URL      bunker:// URL of the NIP-46 signer for Zapstore
#   ZAPSTORE_CLIENT_KEY      persistent zsp NIP-46 client key (hex) for it
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON  (optional) base64 of the Play Console
#                            service-account JSON key with release permission on
#                            buzz.armada.app. Empty (unprovisioned) skips the
#                            Google Play publish instead of failing — same
#                            pattern as deploy-web.yml's SSH key.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        # ngit-ci shallow-fetches the tagged commit regardless of fetch-depth;
        # version_code is derived from the tag, so depth doesn't matter here.

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # No setup-android / setup-go / setup-ruby steps: the Android SDK, the
      # zsp binary, and ruby+fastlane are baked into the coordinator's
      # armada-ci runner image (see .ngit/ci-image/Dockerfile), along with the
      # toolcaches that make the setup-node/setup-java actions above no-ops.

      - name: Derive version
        id: version
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"
          # versionCode is derived from the semver tag, NOT git rev-list --count
          # HEAD: ngit-ci's embedded-act runner shallow-fetches only the tagged
          # commit (git fetch --depth=1 origin <oid>), so the commit count is
          # always 1 and every release would get the same code. Deriving from the
          # tag makes the code deterministic, monotonic with semver, and
          # independent of checkout depth.
          #
          # Scheme: major*1_000_000 + minor*1_000 + patch.
          # At 0.31.x this yields 31_000+, already above the GitLab-era ceiling
          # (last release v0.30.1 = 402) and above the first ngit-ci release
          # (v0.31.0 = 10_001). minor/patch each support up to 999.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE="$(( MAJOR * 1000000 + MINOR * 1000 + PATCH ))"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME (code $VERSION_CODE) from tag $TAG"

      - name: Stamp version into android/app/build.gradle
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -eu
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eu
          : "${ANDROID_KEYSTORE_BASE64:?Set the ANDROID_KEYSTORE_BASE64 secret.}"
          : "${KEYSTORE_PASSWORD:?Set the KEYSTORE_PASSWORD secret.}"

          # Decode the JKS and migrate JKS -> PKCS12 for Gradle. PKCS12 uses a
          # single password, so key and store passwords must match (that is the
          # KEY_PASSWORD == KEYSTORE_PASSWORD invariant).
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/my-upload-key.jks
          keytool -importkeystore \
            -srckeystore android/app/my-upload-key.jks \
            -destkeystore android/app/my-upload-key.keystore \
            -deststoretype pkcs12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -srcalias upload \
            -destalias upload \
            -noprompt
          rm android/app/my-upload-key.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}
          keyAlias=upload
          storeFile=my-upload-key.keystore
          EOF

      - name: Build web assets and sync into Capacitor
        env:
          # Non-hosted client: no baked-in relays (the user adds servers). DM
          # voice falls back to the public instance via platform.ts. NEVER pin
          # ws://localhost here — it's meaningless on a phone.
          VITE_PLATFORM_RELAYS: ""
          VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          # Analytics is OFF in the published sovereign APK by default: baking
          # armada.buzz telemetry into every self-hoster's install would betray
          # "your keys, your fleet". Left configurable so an operator building
          # their OWN branded APK can opt in by provisioning the secret; empty
          # (the default) leaves the tracker uninitialized.
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_ENDPOINT: ${{ secrets.VITE_PLAUSIBLE_ENDPOINT }}
        run: |
          set -eu
          npm ci
          npx vite build
          test -f dist/index.html || { echo "vite build produced no dist/index.html" >&2; ls -la dist || true; exit 1; }
          cp dist/index.html dist/404.html
          npx cap sync android

      - name: Build signed release APK + AAB
        run: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Collect and name artifacts
        id: artifacts
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          out="$RUNNER_TEMP/armada-android-v$VERSION_NAME"
          mkdir -p "$out"
          cp android/app/build/outputs/apk/release/app-release.apk "$out/Armada-v$VERSION_NAME.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "$out/Armada-v$VERSION_NAME.aab"
          ls -lh "$out"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      # The APK/AAB are signed now; remove the keystore and password file.
      - name: Remove release signing material
        if: ${{ always() }}
        run: |
          rm -f android/key.properties android/app/my-upload-key.keystore

      # Publish the APK + AAB as run artifacts (they surface on gitworkshop.dev
      # against the tagged commit). Done BEFORE the store publishes so the
      # artifacts exist even if Zapstore or Google Play fails. Upload is safe
      # here — act's broken artifact path is cross-job DOWNLOAD (see the
      # Zapstore note below), not same-job upload.
      - name: Upload APK + AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: armada-android-v${{ steps.version.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.dir }}/Armada-v${{ steps.version.outputs.name }}.apk
            ${{ steps.artifacts.outputs.dir }}/Armada-v${{ steps.version.outputs.name }}.aab

      # Publish to Zapstore in the SAME job. We deliberately do NOT hand the APK
      # off via upload/download-artifact: under act's local artifact server the
      # multi-file wildcard upload round-trips back as a 3-byte stub (digests
      # match on upload, but the download is empty), which then makes `zsp`
      # choke on a non-APK. Building and publishing in one job keeps the real
      # 7 MB signed APK on disk the whole time. zsp itself is baked into the
      # runner image, version-pinned there (see .ngit/ci-image/Dockerfile).
      - name: Publish to Zapstore
        env:
          SIGN_WITH: ${{ secrets.ZAPSTORE_BUNKER_URL }}
          ZAPSTORE_CLIENT_KEY: ${{ secrets.ZAPSTORE_CLIENT_KEY }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          ARTIFACT_DIR: ${{ steps.artifacts.outputs.dir }}
          RELAY_URLS: wss://relay.zapstore.dev,wss://relay.ditto.pub,wss://relay.dreamith.to,wss://relay.primal.net
          BLOSSOM_URL: https://blossom.ditto.pub
        run: |
          set -eu
          : "${SIGN_WITH:?Set the ZAPSTORE_BUNKER_URL secret.}"
          : "${ZAPSTORE_CLIENT_KEY:?Set the ZAPSTORE_CLIENT_KEY secret.}"

          apk_path="$ARTIFACT_DIR/Armada-v$VERSION_NAME.apk"
          test -f "$apk_path"

          # Guard against a truncated/empty APK reaching zsp: a real signed APK
          # is several MB and must be a valid ZIP. Fail loudly here rather than
          # letting zsp die on an unreadable archive.
          apk_size="$(stat -c%s "$apk_path")"
          if [ "$apk_size" -lt 1000000 ]; then
            echo "APK at $apk_path is only ${apk_size} bytes — expected a multi-MB signed APK. Aborting." >&2
            exit 1
          fi
          unzip -l "$apk_path" >/dev/null 2>&1 || {
            echo "APK at $apk_path is not a valid ZIP/APK archive. Aborting." >&2
            exit 1
          }

          # Everything from here (bunker parsing, config prep, zsp) is traced
          # into a single file that a later step ALWAYS uploads as an artifact.
          # act truncates a failing step's console log at the failure point, so
          # earlier attempts died invisibly — e.g. a bad ${SIGN_WITH} format made
          # the `test` below exit under `set -e` with nothing on the console.
          # Redact the client key; never trace it.
          out="${RUNNER_TEMP:-/tmp}/zsp-output.txt"
          set +e
          {
            set -x
            zsp --version || true

            # Restore the persistent NIP-46 client key so the bunker recognizes
            # this workflow as the same application across runs. zsp stores keys
            # at ~/.config/zsp/bunker-keys/<bunker-pubkey>.key
            bunker_pubkey="${SIGN_WITH#bunker://}"
            bunker_pubkey="${bunker_pubkey%%\?*}"
            # Report (don't silently `set -e`-exit) if the scheme wasn't stripped.
            if [ "$bunker_pubkey" = "$SIGN_WITH" ]; then
              echo "SIGN_WITH does not look like a bunker:// URL (no scheme stripped); cannot derive bunker pubkey." >&2
              set +x; exit 1
            fi
            umask 077
            mkdir -p ~/.config/zsp/bunker-keys
            printf '%s\n' "$ZAPSTORE_CLIENT_KEY" > ~/.config/zsp/bunker-keys/"$bunker_pubkey".key

            release_config="$(mktemp zapstore-release.XXXXXX.yaml)"
            cp zapstore.yaml "$release_config"
            sed -i "2i release_source: $apk_path" "$release_config"
            sed -i "2i version: $VERSION_NAME" "$release_config"
            cat "$release_config"

            # --json is a GLOBAL flag and MUST precede `publish`; after it, it is
            # silently ignored and zsp exits 1 with no message.
            # --quiet auto-confirms the "Ready to Publish" prompt — without it
            # zsp tries to open /dev/tty for a yes/no and dies in the headless
            # container ("could not open a new TTY"). zsp's own CI/CD example is
            # exactly `zsp --json publish --quiet ...`.
            # --skip-certificate-linking: the ngit-ci upload key was rotated, so
            # its cert isn't linked to the publishing identity yet.
            zsp --json publish \
              --quiet \
              --skip-metadata \
              --skip-preview \
              --skip-certificate-linking \
              "$release_config"
          } >"$out" 2>&1
          zsp_rc=$?
          echo "=== zsp publish sequence output (rc=$zsp_rc) ==="
          cat "$out" || true
          exit "$zsp_rc"

      # act truncates the failing step's console log, so surface the captured
      # output through the reliable artifact channel whenever publish fails.
      - name: Upload zsp output on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: zsp-output-${{ steps.version.outputs.name }}
          path: ${{ runner.temp }}/zsp-output.txt
          if-no-files-found: warn

      # Publish the AAB to Google Play in the SAME job (ported from ditto's
      # GitLab `publish-google-play` job). Cross-job artifact hand-off is broken
      # under act (see the Zapstore note above), so the AAB must stay on this
      # runner's disk. The publish step skips itself in-shell when the
      # service-account secret isn't provisioned, so releases keep working
      # before the operator sets it up. The skip CANNOT be a step-level
      # `if: ${{ secrets.X != '' }}` — act's schema validator (like GitHub)
      # rejects the `secrets` context in `if:` ("Unknown Variable Access
      # secrets") and the whole workflow fails validation before running.
      # ruby + fastlane are baked into the runner image (incl. multi_json,
      # which representable in fastlane's Play client requires without
      # declaring — see .ngit/ci-image/Dockerfile).
      - name: Publish to Google Play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          ARTIFACT_DIR: ${{ steps.artifacts.outputs.dir }}
        run: |
          set -eu

          # No key provisioned (or non-maintainer trigger): skip the publish.
          if [ -z "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set; skipping Google Play publish."
            exit 0
          fi

          aab_path="$ARTIFACT_DIR/Armada-v$VERSION_NAME.aab"
          test -f "$aab_path"

          # Build the fastlane supply metadata layout for the changelog. supply
          # maps changelogs/<versionCode>.txt to the Play Console "What's new in
          # this version" field. versionCode matches what was stamped into
          # build.gradle above (derived from the tag).
          summary="$(node scripts/extract-release-notes.mjs "$GITHUB_REF_NAME" --summary)"
          changelog_dir="android/fastlane/metadata/android/en-US/changelogs"
          mkdir -p "$changelog_dir"
          printf '%s\n' "$summary" > "$changelog_dir/$VERSION_CODE.txt"
          echo "--- $changelog_dir/$VERSION_CODE.txt ---"
          cat "$changelog_dir/$VERSION_CODE.txt"
          echo "-------------------------------------------"
          # Warn (don't fail) over the documented 500-character limit so it's
          # spotted before the Play Console rejects the upload.
          summary_len=$(wc -c < "$changelog_dir/$VERSION_CODE.txt")
          if [ "$summary_len" -gt 501 ]; then
            echo "WARNING: changelog is $summary_len bytes; convention is <=500."
          fi

          # Decode the base64 service-account JSON to a temp file for fastlane.
          umask 077
          json_key="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" | base64 -d > "$json_key"

          # Upload the AAB to the production track with the changelog. The other
          # metadata (title, description, images, screenshots) is managed in the
          # Play Console and left untouched. No --release_status: supply defaults
          # to "completed", so the upload rolls out on the production track (this
          # matches ditto's working publish-google-play job). It previously
          # passed "draft" because the app had never been published and the API
          # refuses "completed" releases for a draft app; the app is live now.
          fastlane supply \
            --aab "$aab_path" \
            --package_name buzz.armada.app \
            --track production \
            --json_key "$json_key" \
            --metadata_path android/fastlane/metadata/android \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots \
            --skip_upload_apk

      - name: Remove Google Play service account key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/play-service-account.json"
