name: Desktop release

# Electron desktop installers on version tags (vX.Y.Z): Linux (AppImage + deb)
# and Windows (NSIS Setup + portable, cross-built from Linux via wine). macOS
# .dmg is NOT built here — act runs jobs in Linux containers only; the macOS
# build stays on the GitLab mirror (.gitlab-ci.yml, manual `macos` runner).
#
# Armada desktop is a SOVEREIGN, standalone client: it bundles the web build
# and serves it over a custom secure scheme (electron/main.js). The bundle is
# compiled with EMPTY platform relays so nothing is baked in.
#
# Each job builds its own web bundle rather than sharing an artifact: ngit-ci
# resolves `needs` inside one act invocation, so a shared-build fan-in would
# force both platforms onto one job — building twice keeps them independent.
# The version is carried by the git tag (vX.Y.Z), stamped into the Electron
# app's package.json at build time.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone web bundle
        env:
          VITE_PLATFORM_RELAYS: ""
          # OFF in the published sovereign desktop build by default (see the
          # Android release workflow). Configurable for own-branded builds via
          # the provisioned secret; empty = tracker never initialized.
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_ENDPOINT: ${{ secrets.VITE_PLAUSIBLE_ENDPOINT }}
        run: |
          set -eu
          npm ci
          # No `-l error`: act's log capture drops suppressed output, so a
          # failing/empty build looked like a silent success and only surfaced
          # later as "cp: cannot stat 'dist/index.html'". Keep vite's own output.
          npx vite build
          test -f dist/index.html || { echo "vite build produced no dist/index.html" >&2; ls -la dist || true; exit 1; }
          cp dist/index.html dist/404.html
          # Copy the built bundle INTO electron/dist by content. `electron/dist`
          # may already exist (e.g. a work-dir path act keeps around), so a
          # `rm -rf` + `cp -r` races "cannot create directory: File exists".
          # `cp -rT` copies dist's contents into the (created) target dir
          # regardless of whether it pre-exists.
          mkdir -p electron/dist
          find electron/dist -mindepth 1 -delete
          cp -rT dist electron/dist

      - name: Build Linux installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          cd electron
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          npm install --no-audit --no-fund
          npx electron-builder --linux --config electron-builder.yml --publish never

      - name: Collect artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          out="$RUNNER_TEMP/armada-linux-$TAG"
          mkdir -p "$out"
          cp electron/release/*.AppImage "$out/Armada-$TAG-linux-x86_64.AppImage"
          cp electron/release/*.deb "$out/Armada-$TAG-linux-amd64.deb"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-linux-${{ github.ref_name }}
          path: ${{ runner.temp }}/armada-linux-${{ github.ref_name }}/*
          if-no-files-found: error

  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialize behind the linux job. act runs independent jobs in PARALLEL,
    # but gives every job container the SAME bind-mounted workdir — so the two
    # jobs' "Build standalone web bundle" steps collided: one job's
    # `find electron/dist -mindepth 1 -delete` raced the other's `cp -rT`,
    # failing non-deterministically with "cannot delete …: Directory not
    # empty" or "cannot create directory …: File exists". (GitHub-hosted
    # runners give each job a fresh VM; act shares the checkout.) `needs`
    # forces ordering inside the one act invocation — no artifact hand-off
    # involved, each job still builds its own bundle.
    needs: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone web bundle
        env:
          VITE_PLATFORM_RELAYS: ""
          # See the linux job: analytics off by default, opt-in via secret.
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_ENDPOINT: ${{ secrets.VITE_PLAUSIBLE_ENDPOINT }}
        run: |
          set -eu
          npm ci
          npx vite build
          test -f dist/index.html || { echo "vite build produced no dist/index.html" >&2; ls -la dist || true; exit 1; }
          cp dist/index.html dist/404.html
          # See the linux job: copy by content, don't rm+cp the directory.
          mkdir -p electron/dist
          find electron/dist -mindepth 1 -delete
          cp -rT dist electron/dist

      # electron-builder needs wine to produce Windows installers on Linux.
      # The act runner image is not the electronuserland/builder:wine image the
      # GitLab job used, so install wine explicitly here.
      - name: Install wine
        run: |
          set -eu
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 >/dev/null || \
            sudo apt-get install -y --no-install-recommends wine >/dev/null

      - name: Build Windows installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          cd electron
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          npm install --no-audit --no-fund
          npx electron-builder --win --config electron-builder.yml --publish never

      - name: Collect artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          out="$RUNNER_TEMP/armada-windows-$TAG"
          mkdir -p "$out"
          cp electron/release/*Setup*.exe "$out/Armada-$TAG-Setup.exe"
          # The portable build is the non-Setup .exe.
          cp "$(ls electron/release/*.exe | grep -iv setup | head -n1)" "$out/Armada-$TAG-windows-portable.exe"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-windows-${{ github.ref_name }}
          path: ${{ runner.temp }}/armada-windows-${{ github.ref_name }}/*
          if-no-files-found: error
