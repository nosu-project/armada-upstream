name: Desktop release

# Electron desktop installers on version tags (vX.Y.Z): Linux (AppImage + deb)
# and Windows (NSIS Setup + portable, cross-built from Linux via wine). macOS
# .dmg is NOT built here — act runs jobs in Linux containers only; the macOS
# build stays on the GitLab mirror (.gitlab-ci.yml, manual `macos` runner).
#
# Armada desktop is a SOVEREIGN, standalone client: it bundles the web build
# and serves it over a custom secure scheme (electron/main.js). The bundle is
# compiled with EMPTY platform relays so nothing is baked in.
#
# ONE job builds both platforms. It used to be two jobs, but under act they
# could not run in parallel anyway: every job container binds the SAME work
# dir, so the two web-bundle builds raced each other and windows had to be
# serialized behind linux with `needs`. Two serialized jobs meant two
# container spin-ups, two `npm ci` + vite builds, and two electron dep
# installs — a single job does each once and electron-builder produces both
# targets from the same staged bundle. wine and the electron/electron-builder
# download caches are baked into the armada-ci runner image
# (.ngit/ci-image/Dockerfile); the wine step below is only a fallback for
# running on a stock act image.
# The version is carried by the git tag (vX.Y.Z), stamped into the Electron
# app's package.json at build time.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build standalone web bundle
        env:
          VITE_KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
          # OFF in the published sovereign desktop build by default (see the
          # Android release workflow). Configurable for own-branded builds via
          # the provisioned secret; empty = tracker never initialized.
          VITE_PLAUSIBLE_DOMAIN: ${{ secrets.VITE_PLAUSIBLE_DOMAIN }}
          VITE_PLAUSIBLE_ENDPOINT: ${{ secrets.VITE_PLAUSIBLE_ENDPOINT }}
        run: |
          set -eu
          npm ci
          # No `-l error`: act's log capture drops suppressed output, so a
          # failing/empty build looked like a silent success and only surfaced
          # later as "cp: cannot stat 'dist/index.html'". Keep vite's own output.
          npx vite build
          test -f dist/index.html || { echo "vite build produced no dist/index.html" >&2; ls -la dist || true; exit 1; }
          cp dist/index.html dist/404.html
          # Copy the built bundle INTO electron/dist by content. `electron/dist`
          # may already exist (e.g. a work-dir path act keeps around), so a
          # `rm -rf` + `cp -r` races "cannot create directory: File exists".
          # `cp -rT` copies dist's contents into the (created) target dir
          # regardless of whether it pre-exists.
          mkdir -p electron/dist
          find electron/dist -mindepth 1 -delete
          cp -rT dist electron/dist

      # electron-builder needs wine for the Windows targets. wine is baked into
      # the armada-ci runner image; this fallback only runs on a stock act
      # image (e.g. someone else's coordinator without the custom image).
      - name: Install wine (fallback for stock runner images)
        run: |
          set -eu
          command -v wine >/dev/null 2>&1 && { echo "wine present: $(wine --version)"; exit 0; }
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wine wine32 wine64 >/dev/null || \
            sudo apt-get install -y --no-install-recommends wine >/dev/null

      - name: Build Linux + Windows installers
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          cd electron
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" package.json
          npm ci --no-audit --no-fund
          npx electron-builder --linux --win --config electron-builder.yml --publish never

      - name: Collect artifacts
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          out_linux="$RUNNER_TEMP/armada-linux-$TAG"
          out_windows="$RUNNER_TEMP/armada-windows-$TAG"
          mkdir -p "$out_linux" "$out_windows"
          cp electron/release/*.AppImage "$out_linux/Armada-$TAG-linux-x86_64.AppImage"
          cp electron/release/*.deb "$out_linux/Armada-$TAG-linux-amd64.deb"
          cp electron/release/*Setup*.exe "$out_windows/Armada-$TAG-Setup.exe"
          # The portable build is the non-Setup .exe.
          cp "$(ls electron/release/*.exe | grep -iv setup | head -n1)" "$out_windows/Armada-$TAG-windows-portable.exe"
          ls -lh "$out_linux" "$out_windows"

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-linux-${{ github.ref_name }}
          path: ${{ runner.temp }}/armada-linux-${{ github.ref_name }}/*
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: armada-desktop-windows-${{ github.ref_name }}
          path: ${{ runner.temp }}/armada-windows-${{ github.ref_name }}/*
          if-no-files-found: error
