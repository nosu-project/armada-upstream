<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#100b15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <!-- Standalone/home-screen behavior comes from manifest.json alone
         (display: standalone). Deliberately NO legacy apple-mobile-web-app-*
         meta tags: with apple-mobile-web-app-capable + black-translucent
         present, iOS (observed on iOS 26 / iPhone 16 Pro) takes the legacy
         home-screen layout path and sizes the standalone webview to
         screen-minus-status-bar while anchoring it at the top, leaving a
         dead ~62pt letterbox band below the page that no in-page CSS can
         remove. Manifest-only (Ditto's config) sizes the window correctly. -->
    <title>Armada</title>
    <!-- Stamped per build (armada-build-stamp Vite plugin); lets a device's
         running bundle be identified when debugging stale-PWA issues. -->
    <meta name="build" content="__BUILD_STAMP__" />
    <meta name="description" content="A sovereign harbor on the open relays — NIP-29 servers, channels, and voice. Your keys, your fleet." />

    <!-- Open Graph / social. og:image/twitter:image MUST be absolute URLs on
         the canonical host — most crawlers (X, Discord, Slack, iMessage) do
         not resolve relative URLs and the card renders with no image. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Armada" />
    <meta property="og:description" content="A sovereign harbor on the open relays — NIP-29 servers, channels, and voice. Your keys, your fleet." />
    <meta property="og:image" content="https://armada.buzz/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://armada.buzz" />
    <meta property="og:site_name" content="Armada" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Armada" />
    <meta name="twitter:description" content="A sovereign harbor on the open relays. Your keys, your fleet." />
    <meta name="twitter:image" content="https://armada.buzz/og.png" />

    <script>
      // Mark home-screen (standalone PWA) launches on <html> before first
      // paint so CSS can scroll-lock the shell (see index.css).
      if (window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches || window.navigator.standalone === true) {
        document.documentElement.classList.add("standalone");
      }
    </script>
    <script src="/theme.js"></script>
  </head>
  <body>
    <!-- Static boot splash: the same animated Armada crest as BootSplash.tsx,
         inlined so it paints on the very first frame — before the JS bundle
         parses, the provider tree mounts, and the first lazy route chunk loads.
         Without it, an APK cold start (logged in) showed a blank themed
         background for a few seconds until React could render its own splash.
         React's createRoot(#root).render() replaces these children on mount,
         so it disappears the moment the app paints. Uses the CSS vars theme.js
         set on :root before this markup, so it matches the persisted theme. -->
    <div id="root">
      <div id="boot-splash" role="status" aria-label="Loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:hsl(var(--background, 260 22% 9%));">
        <svg width="96" height="96" viewBox="0 0 256 256" fill="none" role="img" aria-label="Armada logo" style="animation:armada-rise 0.9s cubic-bezier(0.22,1,0.36,1) both;filter:drop-shadow(0 8px 24px hsl(var(--primary, 330 90% 62%) / 0.25));">
          <path d="M64 16 H232 a8 8 0 0 1 8 8 V192 L192 240 H24 a8 8 0 0 1 -8 -8 V64 Z" fill="none" stroke="hsl(var(--foreground, 42 38% 90%) / 0.85)" stroke-width="10" pathLength="1" style="animation:armada-draw 1.1s ease-out 0.15s both;"></path>
          <g style="transform-origin:128px 128px;animation:armada-blade-in 0.7s cubic-bezier(0.34,1.56,0.64,1) 0.5s both;">
            <path d="M128 56 L180 162 H158 L128 100 L98 162 H76 Z" fill="hsl(var(--primary, 330 90% 62%))" style="animation:armada-glow 2.4s ease-in-out 1.2s infinite;"></path>
            <path d="M106 134 H150 L158 150 H98 Z" fill="hsl(var(--background, 260 22% 9%))"></path>
          </g>
          <g stroke="hsl(var(--accent2, 180 90% 55%))" stroke-linecap="round">
            <path d="M88 184 H168" stroke-width="6" pathLength="1" style="animation:armada-wake 1.8s ease-in-out 0.8s infinite;"></path>
            <path d="M104 200 H152" stroke-width="4" opacity="0.7" pathLength="1" style="animation:armada-wake 1.8s ease-in-out 1.0s infinite;"></path>
          </g>
        </svg>
      </div>
    </div>
    <style>
      @keyframes armada-rise { from { opacity: 0; transform: translateY(18px) scale(0.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes armada-draw { from { stroke-dasharray: 1; stroke-dashoffset: 1; } to { stroke-dasharray: 1; stroke-dashoffset: 0; } }
      @keyframes armada-blade-in { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
      @keyframes armada-glow { 0%, 100% { filter: drop-shadow(0 0 0 hsl(var(--primary, 330 90% 62%) / 0)); } 50% { filter: drop-shadow(0 0 10px hsl(var(--primary, 330 90% 62%) / 0.65)); } }
      @keyframes armada-wake { 0% { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; } 25% { opacity: 1; } 60% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dasharray: 1; stroke-dashoffset: -1; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { #boot-splash [style*="animation"] { animation: none !important; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
